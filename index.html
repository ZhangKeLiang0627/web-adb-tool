<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>web-adb-tool</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="brand">
          <span class="brand-name">web-adb-tool</span>
          <span class="badge badge-version">v0.2.5</span>
        </div>
        <div class="header-actions">
          <div id="conn-status" class="status">
            <span class="dot"></span><span class="status-text">未连接</span>
          </div>
          <button id="theme-toggle" class="btn btn-ghost" type="button">深色</button>
        </div>
      </header>

      <main class="app-main">
        <aside class="panel panel-connect">
          <h2 class="panel-title">连接</h2>
          <div class="connect-body">
            <button id="btn-connect" class="btn btn-primary" type="button">连接设备</button>
            <p class="hint" id="hint-browser">仅支持 Chrome / Edge 等 Chromium 内核浏览器</p>
            <div id="device-info" class="device-info"></div>
          </div>
        </aside>

        <section class="panel panel-shell">
          <h2 class="panel-title">
            <span>Shell 终端</span>
            <button id="btn-shell-new" class="btn btn-ghost" type="button" disabled>新终端</button>
          </h2>
          <div id="shell-terminal" class="shell-terminal" aria-label="交互式终端"></div>
        </section>

        <section class="panel panel-files">
          <h2 class="panel-title">文件传输</h2>
          <div class="files-body">
            <div class="file-row">
              <label for="file-remote">远程路径（目录或完整文件路径）</label>
              <input
                id="file-remote"
                class="input"
                type="text"
                placeholder="/tmp（目录自动拼文件名，或 /tmp/foo.txt）"
                disabled
              />
            </div>
            <div class="file-actions">
              <button id="btn-upload" class="btn" type="button" disabled>上传 (push)</button>
              <button id="btn-download" class="btn" type="button" disabled>下载 (pull)</button>
            </div>
            <input id="file-input" type="file" hidden />
            <div id="file-progress" class="progress"><div class="progress-bar"></div></div>
            <div id="file-progress-text" class="file-progress-text"></div>
            <div id="file-log" class="file-log"></div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
