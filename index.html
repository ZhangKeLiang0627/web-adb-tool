<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>web-adb-tool</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="brand">
          <span class="brand-name">web-adb-tool</span>
          <span class="badge badge-version">v0.3.2</span>
        </div>
        <div class="header-actions">
          <div id="conn-status" class="status">
            <span class="dot"></span><span class="status-text">未连接</span>
          </div>
          <button id="theme-toggle" class="btn btn-ghost" type="button">深色</button>
        </div>
      </header>

      <main class="app-main">
        <aside class="panel panel-connect">
          <h2 class="panel-title">连接</h2>
          <div class="connect-body">
            <button id="btn-connect" class="btn btn-primary" type="button">连接设备</button>
            <p class="hint" id="hint-browser">仅支持 Chrome / Edge 等 Chromium 内核浏览器</p>
            <div id="device-info" class="device-info"></div>
          </div>
        </aside>

        <div class="pane-resizer" data-resizer="connect" role="separator" aria-orientation="vertical" aria-label="调整连接栏宽度" title="拖动调整连接栏宽度"></div>

        <section class="panel panel-shell">
          <h2 class="panel-title">
            <span>Shell 终端</span>
            <button id="btn-shell-new" class="btn btn-ghost" type="button" disabled>新终端</button>
          </h2>
          <div id="shell-terminal" class="shell-terminal" aria-label="交互式终端"></div>
        </section>

        <div class="pane-resizer" data-resizer="files" role="separator" aria-orientation="vertical" aria-label="调整文件管理栏宽度" title="拖动调整文件管理栏宽度"></div>

        <section class="panel panel-files">
          <h2 class="panel-title">
            <span>文件管理</span>
            <button id="fm-refresh" class="btn btn-ghost" type="button" disabled>刷新</button>
          </h2>
          <div class="files-body">
            <div class="fm-pathbar">
              <input
                id="fm-path"
                class="input fm-path"
                type="text"
                placeholder="输入绝对路径回车跳转，如 /tmp"
                autocomplete="off"
                spellcheck="false"
                disabled
              />
              <button id="fm-go" class="btn" type="button" disabled>前往</button>
              <button id="fm-up" class="btn" type="button" disabled>上级</button>
            </div>
            <div id="fm-crumbs" class="fm-crumbs"></div>

            <div class="fm-head">
              <input id="fm-check-all" type="checkbox" title="全选" />
              <span class="fm-name-col">名称</span>
              <span class="fm-meta-col">大小</span>
              <span class="fm-meta-col fm-time-col">修改时间</span>
            </div>
            <div id="fm-list" class="fm-list" role="listbox"></div>

            <div class="fm-ops">
              <button id="fm-upload-files" class="btn btn-sm" type="button" disabled>上传文件</button>
              <button id="fm-upload-dir" class="btn btn-sm" type="button" disabled>上传文件夹</button>
              <button id="fm-mkdir" class="btn btn-sm" type="button" disabled>新建目录</button>
              <span class="fm-spacer"></span>
              <button id="fm-download" class="btn btn-sm" type="button" disabled>下载选中</button>
              <button id="fm-rename" class="btn btn-sm" type="button" disabled>改名</button>
              <button id="fm-chmod" class="btn btn-sm" type="button" disabled>权限</button>
              <button id="fm-delete" class="btn btn-sm btn-danger" type="button" disabled>删除</button>
            </div>
            <p class="hint">单击选中 · 双击进入目录 / 下载文件 · 可拖拽文件或文件夹到此处上传</p>

            <input id="file-input" type="file" multiple hidden />
            <input id="dir-input" type="file" webkitdirectory hidden />
            <div id="file-progress" class="progress"><div class="progress-bar"></div></div>
            <div id="file-progress-text" class="file-progress-text"></div>
            <div id="file-log" class="file-log"></div>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
